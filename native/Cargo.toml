[workspace]
members = ["crates/core", "crates/discord", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/dariusnv/Vesktop-GPUI"

[workspace.dependencies]
vesktop-core = { path = "crates/core" }
vesktop-discord = { path = "crates/discord" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-channel = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
twilight-http = "=0.17.1"
twilight-model = "=0.17.1"
twilight-gateway = "=0.17.1"

[profile.release]
strip = "debuginfo"
